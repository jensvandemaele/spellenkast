<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spellenkast</title>
  <meta name="description" content="Klassieke solospellen die offline werken: Blokval, Woordzoeker, 2048 en Klondike.">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16191d" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Spellenkast">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="js/app.js">
</head>
<body data-scherm="start">
  <header class="bovenbalk">
    <button id="terug" class="knop klein terug" type="button" hidden aria-label="Terug naar spellen">‹<span class="terug-tekst"> Spellen</span></button>
    <h1 id="titel">Spellenkast</h1>
    <div id="acties" class="acties"></div>
  </header>
  <main id="weergave" tabindex="-1"></main>
  <div id="update" class="updatebalk" hidden role="status">
    <span>Er is een nieuwe versie klaar.</span>
    <button class="knop klein primair" type="button">Bijwerken</button>
  </div>
  <div id="melding" class="melding" role="status" aria-live="polite"></div>
  <dialog id="dialoog"></dialog>
  <noscript><p class="noscript">Spellenkast heeft JavaScript nodig.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
